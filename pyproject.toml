[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gatewaysscan"
version = "0.1.0"
authors = [
  { name="Diwazz", email="diwazz@example.com" },
]
description = "A futuristic CLI tool for scanning websites for server and payment gateway information."
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Development Status :: 3 - Alpha",
    "Topic :: Security",
    "Topic :: Internet :: WWW/HTTP",
]
dependencies = [
    "requests",
    "beautifulsoup4",
    "click",
    "rich",
]

[project.urls]
"Homepage" = "https://github.com/GunYamazakii/Stripe-Charge"
"Bug Tracker" = "https://github.com/GunYamazakii/Stripe-Charge/issues"

[project.scripts]
gatewaysscan = "gatewaysscan.cli:cli"

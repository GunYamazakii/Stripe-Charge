<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚡ STRIPE CC CHECKER - ULTRA KHATARNAK</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Roboto+Mono:wght@400;700&display=swap');

        :root {
            --primary-color: #00FFC0; /* Neon Green */
            --secondary-color: #FF0077; /* Neon Pink */
            --background-color: #050505; /* Ultra Deep Black */
            --surface-color: #151515; /* Dark Gray */
            --text-color: #E0E0E0;
            --success-color: #00FFC0;
            --error-color: #FF0077;
            --warning-color: #FFD700;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Roboto Mono', monospace;
            background-color: var(--background-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            overflow: hidden;
            /* Advanced Grid/Scanline Effect */
            background-image: 
                linear-gradient(to right, rgba(0, 255, 192, 0.05) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(0, 255, 192, 0.05) 1px, transparent 1px);
            background-size: 25px 25px;
            animation: scanline 10s linear infinite;
        }

        @keyframes scanline {
            0% { background-position: 0 0; }
            100% { background-position: 0 100%; }
        }

        .container {
            width: 100%;
            max-width: 800px;
            background-color: var(--surface-color);
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 0 30px var(--primary-color), 0 0 60px var(--secondary-color);
            border: 3px solid var(--primary-color);
            position: relative;
            z-index: 10;
            animation: pulseBorder 4s infinite alternate;
            transform: perspective(1000px) rotateX(2deg); /* Slight 3D tilt */
        }

        @keyframes pulseBorder {
            0% { border-color: var(--primary-color); box-shadow: 0 0 15px var(--primary-color), 0 0 30px var(--secondary-color); }
            100% { border-color: var(--secondary-color); box-shadow: 0 0 30px var(--secondary-color), 0 0 60px var(--primary-color); }
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            text-align: center;
            color: var(--primary-color);
            margin-bottom: 15px;
            font-weight: 900;
            letter-spacing: 5px;
            text-shadow: 0 0 10px var(--primary-color);
            border-bottom: 2px solid var(--secondary-color);
            padding-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: var(--secondary-color);
            margin-bottom: 30px;
            font-weight: 400;
            text-shadow: 0 0 5px var(--secondary-color);
        }

        .input-group {
            margin-bottom: 30px;
            position: relative;
        }

        label {
            display: block;
            margin-bottom: 10px;
            font-weight: 700;
            color: var(--primary-color);
            text-transform: uppercase;
            font-size: 1.1em;
        }

        input[type="text"] {
            width: 100%;
            padding: 18px;
            border: 2px solid var(--secondary-color);
            border-radius: 8px;
            background-color: #000000;
            color: var(--text-color);
            font-size: 20px;
            font-family: 'Roboto Mono', monospace;
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 15px var(--primary-color);
        }

        button {
            width: 100%;
            padding: 18px;
            background-color: var(--secondary-color);
            color: var(--background-color);
            border: none;
            border-radius: 8px;
            font-size: 22px;
            font-weight: 900;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.1s, box-shadow 0.3s;
            text-transform: uppercase;
            box-shadow: 0 0 15px var(--secondary-color);
            position: relative;
            overflow: hidden;
        }

        button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.3);
            transition: all 0.5s;
            transform: skewX(-20deg);
        }

        button:hover::before {
            left: 100%;
        }

        button:active {
            transform: scale(0.98);
        }

        button:disabled {
            background-color: #555;
            box-shadow: none;
            cursor: not-allowed;
        }

        .result-box {
            margin-top: 30px;
            padding: 25px;
            border-radius: 8px;
            min-height: 200px;
            background-color: #000000;
            white-space: pre-wrap;
            font-family: 'Roboto Mono', monospace;
            font-size: 15px;
            line-height: 1.8;
            border-left: 5px solid var(--primary-color);
            box-shadow: inset 0 0 15px rgba(0, 0, 0, 0.7);
            overflow-x: auto;
            animation: matrixEffect 0.1s infinite alternate;
        }

        @keyframes matrixEffect {
            0% { text-shadow: 0 0 1px rgba(0, 255, 192, 0.5); }
            100% { text-shadow: 0 0 2px rgba(0, 255, 192, 0.8); }
        }

        .result-box.approved {
            border-left-color: var(--success-color);
            box-shadow: 0 0 15px var(--success-color);
        }

        .result-box.declined {
            border-left-color: var(--error-color);
            box-shadow: 0 0 15px var(--error-color);
        }

        .result-box.error {
            border-left-color: var(--warning-color);
            box-shadow: 0 0 15px var(--warning-color);
        }

        .rate-limit-info {
            text-align: center;
            margin-top: 20px;
            font-size: 16px;
            color: var(--primary-color);
            text-shadow: 0 0 5px var(--primary-color);
        }

        .loading-spinner {
            border: 5px solid rgba(255, 255, 255, 0.1);
            border-top: 5px solid var(--primary-color);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 0.6s linear infinite;
            display: none;
            margin: 20px auto 0;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Result Text Styling for better readability */
        .result-box strong {
            color: var(--primary-color);
            font-weight: 700;
        }
        .result-box .declined-text {
            color: var(--error-color);
            font-weight: 900;
        }
        .result-box .approved-text {
            color: var(--success-color);
            font-weight: 900;
        }
        .result-box span {
            color: var(--secondary-color);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>⚡ STRIPE CC CHECKER [V3.0]</h1>
        <p class="subtitle">INITIATE HIGH-LEVEL CARD VALIDATION SEQUENCE</p>

        <div class="input-group">
            <label for="cc-input">CARD | MM | YY | CVV</label>
            <input type="text" id="cc-input" placeholder="e.g., 5518277061394423|03|29|562">
        </div>

        <button id="check-button">INITIATE SCAN PROTOCOL</button>
        <div class="loading-spinner" id="loading-spinner"></div>

        <div class="result-box" id="result-box">
            <span style="color: var(--secondary-color);">SYSTEM LOG:</span> Awaiting input. Protocol V3.0 engaged.
        </div>

        <p class="rate-limit-info" id="rate-limit-info">
            SCAN LIMIT: 5/HOUR. 5 checks remaining.
        </p>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const ccInput = document.getElementById('cc-input');
            const checkButton = document.getElementById('check-button');
            const resultBox = document.getElementById('result-box');
            const loadingSpinner = document.getElementById('loading-spinner');
            const rateLimitInfo = document.getElementById('rate-limit-info');

            // Function to update the rate limit display
            function updateRateLimit(remaining) {
                rateLimitInfo.textContent = `SCAN LIMIT: 5/HOUR. ${remaining} checks remaining.`;
            }

            updateRateLimit(5); // Initial value

            checkButton.addEventListener('click', async () => {
                const ccDetails = ccInput.value.trim();
                if (!ccDetails) {
                    resultBox.innerHTML = `<span style="color: var(--warning-color);">[WARNING]</span> Input field cannot be empty.`;
                    resultBox.className = 'result-box error';
                    return;
                }

                // Basic format validation (CARD|MM|YY|CVV)
                if (ccDetails.split('|').length !== 4) {
                    resultBox.innerHTML = `<span style="color: var(--warning-color);">[ERROR]</span> Invalid format. Use CARD|MM|YY|CVV.`;
                    resultBox.className = 'result-box error';
                    return;
                }

                // UI State: Loading
                checkButton.disabled = true;
                checkButton.textContent = 'SCANNING... ACCESSING DATABASES...';
                loadingSpinner.style.display = 'block';
                resultBox.innerHTML = `<span style="color: var(--primary-color);">[PROCESSING]</span> Initiating validation sequence...`;
                resultBox.className = 'result-box';

                try {
                    const response = await fetch(`/stripe/cc?cc=${encodeURIComponent(ccDetails)}`);
                    const data = await response.json();

                    // UI State: Result
                    loadingSpinner.style.display = 'none';
                    checkButton.disabled = false;
                    checkButton.textContent = 'INITIATE SCAN PROTOCOL';

                    if (data.status === 'rate_limited') {
                        resultBox.innerHTML = `<span style="color: var(--error-color);">[RATE LIMIT]</span> ${data.message}`;
                        resultBox.className = 'result-box error';
                        updateRateLimit(data.remaining);
                    } else if (data.status === 'error') {
                        resultBox.innerHTML = `<span style="color: var(--error-color);">[SYSTEM ERROR]</span> ${data.message}`;
                        resultBox.className = 'result-box error';
                    } else {
                        // Success or Decline (from mock function)
                        let formattedResult = data.result
                            .replace('**DECLINED ❌**', '<strong class="declined-text">DECLINED ❌</strong>')
                            .replace('**APPROVED ✅**', '<strong class="approved-text">APPROVED ✅</strong>')
                            .replace(/(\b[A-Z]{2,}\b):/g, '<span style="color: var(--secondary-color);">$1:</span>');

                        resultBox.innerHTML = formattedResult;
                        resultBox.className = `result-box ${data.status}`; // 'approved' or 'declined'
                        updateRateLimit(data.remaining_checks);
                    }

                } catch (error) {
                    // UI State: Error
                    loadingSpinner.style.display = 'none';
                    checkButton.disabled = false;
                    checkButton.textContent = 'INITIATE SCAN PROTOCOL';
                    resultBox.innerHTML = `<span style="color: var(--error-color);">[NETWORK ERROR]</span> Could not connect to API.`;
                    resultBox.className = 'result-box error';
                }
            });
        });
    </script>
</body>
</html>
